<g clip-path="url(#tick)" font-size="28">
<text class="w w0" y="222" style="animation-delay:-0.5s"><tspan fill-opacity="0">I build&#160;</tspan><tspan fill="#60A5FA">React Native apps</tspan></text>
<text class="w w1" y="222" style="animation-delay:2.1s"><tspan fill-opacity="0">I build&#160;</tspan><tspan fill="#60A5FA">ExpressJS services</tspan></text>
<text class="w w2" y="222" style="animation-delay:4.7s"><tspan fill-opacity="0">I build&#160;</tspan><tspan fill="#60A5FA">data crawlers &amp; scrapers</tspan></text>
<text class="w w3" y="222" style="animation-delay:7.3s"><tspan fill-opacity="0">I build&#160;</tspan><tspan fill="#60A5FA">Next.js platforms</tspan></text>
<text class="w w4" y="222" style="animation-delay:9.9s"><tspan fill-opacity="0">I build&#160;</tspan><tspan fill="#60A5FA">Chromium extensions</tspan></text>
<text class="w w5" y="222" style="animation-delay:12.5s"><tspan fill-opacity="0">I build&#160;</tspan><tspan fill="#60A5FA">fluid Reanimated UIs</tspan></text>
<text class="w w6" y="222" style="animation-delay:15.1s"><tspan fill-opacity="0">I build&#160;</tspan><tspan fill="#60A5FA">BLE-connected products</tspan></text>
<text class="w w7" y="222" style="animation-delay:17.7s"><tspan fill-opacity="0">I build&#160;</tspan><tspan fill="#60A5FA">AI-powered tools</tspan></text>
</g>
